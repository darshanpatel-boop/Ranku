<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajout O1</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="modal-blue.css">
<style>
/* O1 — Base N1 en bleu + ajout DIRECT dans un tier depuis l'affiche + bandeau récap des tiers */
.win { background: linear-gradient(180deg, #232c45 0, #262a35 160px); }
.head { display: flex; align-items: center; gap: 12px; padding: 18px 20px 0; }
.head h2 { margin: 0; flex: 1; font: 800 26px 'Baloo 2', sans-serif; }
.bar { padding: 14px 20px 6px; }
.pills { display: flex; gap: 8px; padding: 8px 20px 12px; overflow-x: auto; }
.grid { flex: 1; overflow-y: auto; padding: 8px 20px 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 18px 12px; align-content: start; min-height: 280px; }
.it { position: relative; }
.it img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 12px; border: 2px solid #0e1016; box-shadow: 0 4px 0 rgba(0,0,0,.4); display: block; cursor: pointer; transition: transform .15s, filter .15s; }
.it:hover img, .it.open img { transform: translateY(-4px); }
.it b { display: block; margin-top: 8px; font: 600 13px/1.25 Inter, sans-serif; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.it .sc { position: absolute; top: 8px; left: 8px; padding: 2px 7px; border-radius: 99px; background: rgba(0,0,0,.68); font: 700 11px Inter, sans-serif; color: #ffe066; }
.strip { position: absolute; left: 6px; right: 6px; bottom: 56px; display: none; gap: 4px; padding: 6px; border-radius: 12px; background: rgba(12,14,20,.92); box-shadow: 0 6px 16px rgba(0,0,0,.5); justify-content: center; z-index: 3; }
.it:hover .strip, .it.open .strip { display: flex; }
.strip button { flex: 1; min-width: 0; height: 30px; border: 0; border-radius: 8px; font: 800 14px 'Baloo 2', sans-serif; cursor: pointer; padding: 0; }
.strip button.pool { flex: 0 0 auto; padding: 0 8px; background: #3a4052; color: #e4e7f3; font: 700 11px Inter, sans-serif; }
.it .where { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font: 800 17px 'Baloo 2', sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.it.added img { filter: brightness(.72); }
.recap { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid #12141b; background: #1f222b; flex-wrap: wrap; }
.recap .t { display: flex; align-items: center; gap: 5px; padding: 4px 9px 4px 5px; border-radius: 99px; background: #2d313d; font-size: 12px; color: #c9cde0; }
.recap .t i { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font: 800 12px 'Baloo 2', sans-serif; font-style: normal; }
.recap .sp { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.recap a { color: #7fb0ff; font-size: 13px; text-decoration: underline; cursor: pointer; }
</style></head><body>
<script src="mock.js"></script><script src="modal.js"></script>
<div class="veil"><div class="win">
  <div class="head"><h2>Ajouter des animés</h2><button class="x" aria-label="Fermer">✕</button></div>
  <div class="bar"><label class="srch"><span id="ic"></span><input id="q" placeholder="Titre d'un animé…" autocomplete="off"></label></div>
  <div class="pills"><button class="pill on">Tous</button><button class="pill">Séries</button><button class="pill">Films</button><button class="pill">OVA / ONA</button></div>
  <div class="grid" id="grid"></div>
  <div class="recap"><span id="chips" style="display:contents"></span><span class="sp"><a>Chercher aussi sur AniList</a><button class="go">Terminé</button></span></div>
</div></div>
<script>
document.getElementById('ic').innerHTML = ICON;
const T = [['S', '#ff7aa2', '#fff'], ['A', '#ffb83d', '#2a1a00'], ['B', '#ffe066', '#2a2200'], ['C', '#4ade9f', '#04281c'], ['D', '#6ea0ff', '#fff'], ['Non classé', '#4a5068', '#e4e7f3']];
const tc = (n) => T.find((x) => x[0] === n);
const placed = { 2: 'S', 6: 'Non classé', 11: 'A' };
const grid = document.getElementById('grid'), q = document.getElementById('q');
function draw() {
  const rows = found(q.value);
  grid.innerHTML = rows.length ? rows.map((m) => {
    const w = placed[m.n];
    return `<div class="it${w ? ' added' : ''}" data-n="${m.n}"><img src="${m.i}" alt=""><span class="sc">★ ${m.score}</span>${w ? `<span class="where" style="background:${tc(w)[1]};color:${tc(w)[2]}">${w === 'Non classé' ? '•' : w}</span>` : ''}
      <div class="strip">${T.slice(0, 5).map(([n, c, k]) => `<button data-t="${n}" style="background:${c};color:${k}">${n}</button>`).join('')}<button class="pool" data-t="Non classé">Non cl.</button></div><b>${m.t}</b><span class="meta">${m.meta}</span></div>`;
  }).join('') : '<div class="empty">Aucun résultat dans la base.</div>';
  const cnt = (n) => Object.values(placed).filter((v) => v === n).length;
  document.getElementById('chips').innerHTML = T.map(([n, c, k]) => `<span class="t"><i style="background:${c};color:${k}">${n === 'Non classé' ? '•' : n}</i>${cnt(n)}</span>`).join('');
}
grid.addEventListener('click', (e) => {
  const it = e.target.closest('.it'); if (!it) return;
  const b = e.target.closest('[data-t]');
  if (b) { placed[+it.dataset.n] = b.dataset.t; draw(); return; }
  if (e.target.closest('img')) { const o = it.classList.contains('open'); grid.querySelectorAll('.open').forEach((x) => x.classList.remove('open')); if (!o) it.classList.add('open'); }
});
q.addEventListener('input', draw);
document.querySelectorAll('.pill').forEach((p) => p.onclick = () => { document.querySelector('.pill.on').classList.remove('on'); p.classList.add('on'); });
draw();
</script></body></html>
