<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposition A</title>
<link rel="stylesheet" href="base.css">
<style>
.row { display: flex; border-radius: 16px; overflow: hidden; margin-bottom: 12px; border: 2px solid var(--edge); box-shadow: 0 5px 0 rgba(0,0,0,.4); background: var(--bg2); }
.row .lab { flex: 0 0 104px; display: flex; align-items: center; justify-content: center; font: 800 52px 'Baloo 2', sans-serif; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
.row .cells { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; min-height: 146px; align-content: flex-start; }
.pool { border: 2px dashed #4a5064; border-radius: 16px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; background: #262a35; }
</style></head><body>
<script src="mock.js"></script><script src="common.js"></script>
<div class="wrap">
  <h1>Mes animés préférés</h1><div class="sub">17 animés · 5 tiers</div>
  <div id="rows"></div>
  <div class="dot"><i></i>Non classé</div>
  <div class="pool" id="pool"></div>
  <span class="btn">+ Ajouter des animés</span>
</div>
<script>
document.getElementById('rows').innerHTML = rowsHtml((t) => `<div class="row"><div class="lab" style="background:linear-gradient(135deg,${t.c1},${t.c2});color:${t.ink}">${t.n}</div><div class="cells">${t.items.map((i) => poster(i)).join('')}</div></div>`);
document.getElementById('pool').innerHTML = POOL.map((i) => poster(i)).join('');
</script></body></html>
