<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposition G</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="cork.css">
<style>
/* G : tiers collés dans un seul bloc ; la colonne des lettres est UN dégradé continu S→D, séparations très fines */
.board { position: relative; border-radius: 16px; overflow: hidden; border: 2px solid var(--edge); box-shadow: 0 5px 0 rgba(0,0,0,.4); background: #1c1f27; }
.board::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 104px; background: var(--lab-grad); }
.board .row { border: 0; border-radius: 0; margin: 0; box-shadow: none; background: transparent; }
.board .row + .row .cells { box-shadow: inset 0 1px 0 rgba(255,255,255,.07); }
.board .row + .row .lab { box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
.row .lab { flex: 0 0 104px; display: flex; align-items: center; justify-content: center; font: 800 52px 'Baloo 2', sans-serif; position: relative; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
</style></head><body>
<script src="mock.js"></script><script src="common.js"></script>
<div class="wrap">
  <h1>Mes animés préférés</h1><div class="sub">17 animés · 5 tiers</div>
  <div class="board" id="rows"></div>
  <div class="cork" id="pool"><div class="note">Non classé</div></div>
  <span class="btn">+ Ajouter des animés</span>
</div>
<script>
const board = document.getElementById('rows');
board.style.setProperty('--lab-grad', `linear-gradient(180deg, ${TIERS.map((t, i) => `${t.c1} ${Math.round((i + 0.5) / TIERS.length * 100)}%`).join(', ')})`);
board.innerHTML = rowsHtml((t) => `<div class="row"><div class="lab" style="color:${t.ink}">${t.n}</div><div class="cells">${t.items.map((i) => poster(i)).join('')}</div></div>`);
document.getElementById('pool').insertAdjacentHTML('beforeend', POOL.map((i) => `<div class="pol">${poster(i)}</div>`).join(''));
</script></body></html>
