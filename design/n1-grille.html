<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajout N1</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="modal.css">
<style>
/* N1 — Grille d'affiches : on voit tout de suite les jaquettes, un toucher = ajouté */
.head { display: flex; align-items: center; gap: 12px; padding: 18px 20px 0; }
.head h2 { margin: 0; flex: 1; font: 800 26px 'Baloo 2', sans-serif; }
.bar { padding: 14px 20px 6px; }
.pills { display: flex; gap: 8px; padding: 8px 20px 12px; overflow-x: auto; }
.grid { flex: 1; overflow-y: auto; padding: 6px 20px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 16px 12px; align-content: start; min-height: 260px; }
.it { position: relative; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; text-align: left; font: inherit; }
.it img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 12px; border: 2px solid #0e1016; box-shadow: 0 4px 0 rgba(0,0,0,.4); display: block; transition: transform .15s; }
.it:hover img { transform: translateY(-4px); }
.it b { display: block; margin-top: 8px; font: 600 13px/1.25 Inter, sans-serif; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.it .badge { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }
.it.added img { outline: 3px solid #ffd24d; outline-offset: 1px; filter: brightness(.7); }
.it.added .badge { background: #ffd24d; color: #2a1a00; }
.foot { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-top: 1px solid #12141b; background: #1f222b; }
.foot a { color: #ffd24d; font-size: 13px; cursor: pointer; margin-right: auto; text-decoration: underline; }
.foot .count { color: #c9cde0; font-size: 14px; }
</style></head><body>
<script src="mock.js"></script><script src="modal.js"></script>
<div class="veil"><div class="win">
  <div class="head"><h2>Ajouter des animés</h2><button class="x" aria-label="Fermer">✕</button></div>
  <div class="bar"><label class="srch"><span id="ic"></span><input id="q" placeholder="Titre d'un animé…" autocomplete="off"></label></div>
  <div class="pills"><button class="pill on">Tous</button><button class="pill">Séries</button><button class="pill">Films</button><button class="pill">OVA / ONA</button></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><a>Pas trouvé ? Chercher aussi sur AniList</a><span class="count" id="count"></span><button class="go">Terminé</button></div>
</div></div>
<script>
document.getElementById('ic').innerHTML = ICON;
const added = new Set([2, 6]);
const grid = document.getElementById('grid'), q = document.getElementById('q');
function draw() {
  const rows = found(q.value);
  grid.innerHTML = rows.length ? rows.map((m) => `<button class="it${added.has(m.n) ? ' added' : ''}" data-n="${m.n}"><img src="${m.i}" alt=""><span class="badge">${added.has(m.n) ? '✓' : '+'}</span><b>${m.t}</b><span class="meta">${m.meta}</span></button>`).join('') : '<div class="empty">Aucun résultat dans la base.</div>';
  document.getElementById('count').textContent = added.size ? `${added.size} ajouté${added.size > 1 ? 's' : ''}` : '';
}
grid.addEventListener('click', (e) => { const b = e.target.closest('.it'); if (!b) return; const n = +b.dataset.n; added.has(n) ? added.delete(n) : added.add(n); draw(); });
q.addEventListener('input', draw);
document.querySelectorAll('.pill').forEach((p) => p.onclick = () => { document.querySelector('.pill.on').classList.remove('on'); p.classList.add('on'); });
draw();
</script></body></html>
