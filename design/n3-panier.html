<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajout N3</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="modal.css">
<style>
/* N3 — Bandeau chaud + panier : un en-tête coloré comme tes cartes Croc'Savoir, et un panier en bas qui se remplit */
.band { position: relative; padding: 22px 22px 20px; background: linear-gradient(135deg, #ffb83d, #f06292 70%, #ec4899); color: #2a1a00; overflow: hidden; }
.band::after { content: '＋'; position: absolute; right: 14px; bottom: -40px; font: 800 170px/1 'Baloo 2', sans-serif; opacity: .16; }
.band .row1 { display: flex; align-items: center; gap: 12px; }
.band h2 { margin: 0; flex: 1; font: 800 28px 'Baloo 2', sans-serif; color: #2a1020; }
.band .x { background: rgba(0,0,0,.18); color: #2a1020; }
.band .srch { margin-top: 14px; background: #fff; border-color: transparent; position: relative; z-index: 1; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.band .srch input { color: #1c1f27; } .band .srch svg { stroke: #5b5f70; }
.band .srch:focus-within { box-shadow: 0 4px 0 rgba(0,0,0,.2), 0 0 0 4px rgba(255,255,255,.4); border-color: transparent; }
.grid { flex: 1; overflow-y: auto; padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; align-content: start; min-height: 240px; }
.card { display: flex; gap: 12px; align-items: center; padding: 8px; border: 2px solid #12141b; border-radius: 14px; background: #2d313d; box-shadow: 0 4px 0 rgba(0,0,0,.35); color: inherit; text-align: left; font: inherit; cursor: pointer; }
.card:hover { background: #343949; }
.card img { width: 52px; height: 74px; object-fit: cover; border-radius: 8px; border: 2px solid #0e1016; flex: none; }
.card b { display: block; font: 600 14px/1.25 Inter, sans-serif; }
.card .plus { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; background: #ffd24d; color: #2a1a00; display: flex; align-items: center; justify-content: center; font: 800 20px Inter; flex: none; }
.card.in { opacity: .5; } .card.in .plus { background: #4ade9f; }
.tray { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid #12141b; background: #1c1f27; min-height: 84px; }
.tray .lab { color: #9aa0b4; font-size: 13px; white-space: nowrap; }
.tray .thumbs { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding: 4px 2px; }
.thumb { position: relative; flex: none; } .thumb img { width: 42px; height: 60px; object-fit: cover; border-radius: 6px; border: 2px solid #0e1016; display: block; }
.thumb button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border: 0; border-radius: 50%; background: #ef4444; color: #fff; font-size: 10px; cursor: pointer; padding: 0; }
.tray .none { color: #6f7590; font-size: 13px; }
.tray a { color: #ffd24d; font-size: 12px; text-decoration: underline; cursor: pointer; white-space: nowrap; }
</style></head><body>
<script src="mock.js"></script><script src="modal.js"></script>
<div class="veil"><div class="win">
  <div class="band"><div class="row1"><h2>Ajouter des animés</h2><button class="x" aria-label="Fermer">✕</button></div>
    <label class="srch"><span id="ic"></span><input id="q" placeholder="Titre, en français, anglais ou japonais…" autocomplete="off"></label></div>
  <div class="grid" id="grid"></div>
  <div class="tray"><span class="lab">Panier</span><div class="thumbs" id="thumbs"></div><a>Chercher sur AniList</a><button class="go" id="go">Ajouter</button></div>
</div></div>
<script>
document.getElementById('ic').innerHTML = ICON;
const basket = [2, 6, 11];
const q = document.getElementById('q');
function draw() {
  document.getElementById('grid').innerHTML = found(q.value).map((m) => `<button class="card${basket.includes(m.n) ? ' in' : ''}" data-n="${m.n}"><img src="${m.i}" alt=""><span><b>${m.t}</b><span class="meta">${m.meta}</span></span><span class="plus">${basket.includes(m.n) ? '✓' : '+'}</span></button>`).join('') || '<div class="empty">Aucun résultat dans la base.</div>';
  document.getElementById('thumbs').innerHTML = basket.length ? basket.map((n) => `<span class="thumb"><img src="${MOCK[n].i}" alt=""><button data-r="${n}" aria-label="Retirer">✕</button></span>`).join('') : '<span class="none">Touche un animé pour le mettre dans le panier</span>';
  document.getElementById('go').textContent = basket.length ? `Ajouter (${basket.length})` : 'Ajouter';
}
document.getElementById('grid').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (!c) return; const n = +c.dataset.n; const i = basket.indexOf(n); i < 0 ? basket.push(n) : basket.splice(i, 1); draw(); });
document.getElementById('thumbs').addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (b) { basket.splice(basket.indexOf(+b.dataset.r), 1); draw(); } });
q.addEventListener('input', draw);
draw();
</script></body></html>
