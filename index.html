<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1f27">
<title>Ranku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 class="brand"><span>Ran</span><b>ku</b></h1>
  <select id="listSelect" aria-label="Tier list"></select>
  <button id="btnSearch" class="searchbtn" type="button"><span>＋</span> Ajouter des animés</button>
  <button id="btnMenu" class="icon-btn" aria-label="Menu">⋯</button>
</header>

<main id="board"></main>

<div id="placeBar" class="place-bar" hidden></div>

<dialog id="dlgSearch" class="sheet">
  <form method="dialog" class="sheet-head">
    <input id="q" type="search" placeholder="Titre d'un animé…" autocomplete="off" enterkeyhint="search">
    <button class="icon-btn" aria-label="Fermer">✕</button>
  </form>
  <div id="results" class="results"></div>
</dialog>

<dialog id="dlgTier" class="modal">
  <form method="dialog" id="formTier">
    <h2 id="tierTitle">Modifier le tier</h2>
    <div class="tier tier-preview" id="tierPrev">
      <div class="tier-label"><b></b><small></small></div>
      <div class="zone"></div>
    </div>
    <label class="fld">Nom <input id="tierName" maxlength="20" autocomplete="off" placeholder="S, A, Top…"></label>
    <label class="fld">Légende <input id="tierDesc" maxlength="24" autocomplete="off" placeholder="facultatif"></label>
    <div class="swatches" id="swatches" role="group" aria-label="Couleur"></div>
    <div class="foot">
      <div class="only-edit">
        <button type="button" id="tierDel" class="danger sm">Supprimer</button>
        <button type="button" id="tierUp" class="ghost sm" aria-label="Monter">↑</button>
        <button type="button" id="tierDown" class="ghost sm" aria-label="Descendre">↓</button>
      </div>
      <button value="ok" id="tierOk" class="primary">OK</button>
      <button value="cancel" id="tierCancel" class="ghost only-new">Annuler</button>
    </div>
  </form>
</dialog>

<dialog id="dlgMenu" class="modal">
  <form method="dialog">
    <h2>Tier lists</h2>
    <button type="button" data-act="new" class="ghost">Nouvelle tier list</button>
    <button type="button" data-act="rename" class="ghost">Renommer</button>
    <button type="button" data-act="delete" class="danger">Supprimer celle-ci</button>
    <button type="button" data-act="about" class="ghost">À propos</button>
    <button value="close" class="primary">Fermer</button>
  </form>
</dialog>

<dialog id="dlgAbout" class="modal">
  <form method="dialog">
    <h2>À propos</h2>
    <p>Données des animés : <a href="https://github.com/manami-project/anime-offline-database" target="_blank" rel="noopener">anime-offline-database</a> (manami-project), licence <a href="https://opendatacommons.org/licenses/odbl/1.0/" target="_blank" rel="noopener">ODbL 1.0</a>. Complété par l'API <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a> pour les sorties récentes. Les affiches appartiennent à leurs ayants droit.</p>
    <p id="aboutDate"></p>
    <button value="close" class="primary">Fermer</button>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="vendor/Sortable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
